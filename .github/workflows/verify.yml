name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: experiments/api-slice/web/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@10.9.9

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test workspace defaults
        run: cargo test --workspace --locked

      - name: Test API development identity
        run: cargo test --locked -p iris-api-spike --features dev-identity

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Install web dependencies
        run: npm --prefix experiments/api-slice/web ci

      - name: Verify web application and contract
        run: npm --prefix experiments/api-slice/web run verify

      - name: Test local OIDC fixture
        run: node --test experiments/api-slice/checks/oidc-provider.test.mjs

      - name: Install browser runner
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps

      - name: Verify credential-free browser flow
        shell: bash
        run: |
          set -euo pipefail
          node experiments/api-slice/checks/oidc-provider.mjs --port 4000 --issuer http://127.0.0.1:4000 --redirect-uri http://127.0.0.1:5174/api/auth/callback > /tmp/oidc.log 2>&1 &
          oidc=$!
          api=''; web=''
          trap 'kill "$oidc" ${api:-} ${web:-} 2>/dev/null || true' EXIT
          wait_for() {
            for attempt in $(seq 1 90); do
              if curl --fail --silent "$1" >/dev/null; then return; fi
              sleep 1
            done
            cat /tmp/oidc.log /tmp/auth-api.log /tmp/auth-web.log 2>/dev/null || true
            return 1
          }
          wait_for http://127.0.0.1:4000/.well-known/openid-configuration
          IRIS_PUBLIC_ORIGIN=http://127.0.0.1:5174 IRIS_OIDC_ISSUER=http://127.0.0.1:4000 cargo run --locked -p iris-api-spike --bin iris-auth-demo -- --local-oidc-demo > /tmp/auth-api.log 2>&1 &
          api=$!
          npm --prefix experiments/api-slice/web run dev -- --port 5174 > /tmp/auth-web.log 2>&1 &
          web=$!
          wait_for http://127.0.0.1:3002/api/openapi.json
          wait_for http://127.0.0.1:5174
          python3 experiments/api-slice/checks/auth-browser.py http://127.0.0.1:5174 --artifacts /tmp/auth-artifacts
