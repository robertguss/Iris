[package]
name = "iris-reference"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
iris = { path = "../../crates/iris" }
axum = "=0.8.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "=6.0.0"
utoipa-axum = "=0.3.0"
strum = { version = "=0.28.0", features = ["derive"] }
tower-sessions = { version = "=0.15.0", default-features = false, features = ["axum-core"] }
async-trait = "0.1"
time = { version = "0.3", features = ["serde"] }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
getrandom = "0.4"
subtle = "2"
tokio = { workspace = true, features = ["net", "signal"] }
tempfile.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonschema = { version = "=0.57.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
