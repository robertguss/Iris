[package]
name = "iris-api-spike"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
dev-identity = []

[dependencies]
iris-sqlite-spike = { path = "../../embedded-db/sqlite" }
axum = "=0.8.9"
tokio = { workspace = true, features = ["net"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "=6.0.0"
utoipa-axum = "=0.3.0"
aide = { version = "=0.15.1", features = ["axum", "axum-json"] }
schemars = "0.9"
tempfile.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonschema = { version = "=0.57.0", default-features = false }

[[bin]]
name = "iris-api-demo"
path = "src/main.rs"
required-features = ["dev-identity"]

[[bin]]
name = "export-contracts"
path = "src/bin/export-contracts.rs"
